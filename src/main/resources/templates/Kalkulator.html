<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hitung! • Arithmetic Club</title>
  <link rel="stylesheet" th:href="@{/arcade.css}">
  <!-- Anime.js v3.2.2 by Julian Garnier and contributors (MIT). -->
  <script defer src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script defer th:src="@{/arcade.js}"></script>
</head>
<body>
<main>
  <header><span>ARITHMETIC CLUB / 01</span><div class="settings"><button id="motion" type="button" aria-pressed="true">GIF: ON</button><button id="sound" type="button" aria-pressed="false">Suara: OFF</button></div></header>
  <div class="intro"><h1>Hitung<span>!</span></h1><p>Kalkulator dengan riwayat operasi.</p></div>
  <div class="deck">
    <section class="panel controls">
      <h2 th:text="${id == null ? 'Operasi baru' : 'Edit operasi #' + id}">Operasi baru</h2>
      <p class="error" role="alert" th:if="${pesan != null}" th:text="${pesan}"></p>
      <form id="calculator" method="post" th:action="@{/hitung}">
        <input type="hidden" name="id" th:if="${id != null}" th:value="${id}">
        <div class="inputs">
          <label>Bilangan 1<input type="text" name="bilangan1" inputmode="decimal" required maxlength="26" pattern="[+\-]?(?:[0-9]{1,12}(?:[.,][0-9]{0,12})?|[.,][0-9]{1,12})" th:value="${bilangan1}" placeholder="0"></label>
          <label>Operator<select name="operator"><option th:each="op : ${operatorList}" th:value="${op}" th:text="${op}" th:selected="${op == operator}"></option></select></label>
          <label>Bilangan 2<input type="text" name="bilangan2" inputmode="decimal" required maxlength="26" pattern="[+\-]?(?:[0-9]{1,12}(?:[.,][0-9]{0,12})?|[.,][0-9]{1,12})" th:value="${bilangan2}" placeholder="0"></label>
        </div>
        <div class="result">
          <div><span>HASIL</span><output id="result" th:text="${hasil == null ? '—' : hasil}">—</output></div>
          <button class="equals" type="submit" th:attr="aria-label=${id == null ? 'Hitung dan simpan' : 'Simpan perubahan'}">=</button>
        </div>
        <a class="cancel" th:if="${id != null}" th:href="@{/}">Batal edit</a>
      </form>
    </section>
    <aside class="panel reaction">
      <div class="screen"><span id="symbol" aria-hidden="true">+</span><img id="gif" alt="" hidden referrerpolicy="no-referrer"></div>
      <div class="caption"><span id="caption">REAKSI / PENJUMLAHAN</span><a id="gif-source" href="https://github.com/ZekaiDev/anime-reaction-gif">Sumber GIF ↗</a></div>
    </aside>
  </div>
  <section class="panel history">
    <h2>Riwayat operasi</h2>
    <div class="table-wrap"><table>
      <thead><tr><th scope="col">ID</th><th scope="col">Bilangan 1</th><th scope="col">Operator</th><th scope="col">Bilangan 2</th><th scope="col">Hasil</th><th scope="col">Aksi</th></tr></thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(riwayat)}"><td colspan="6">Belum ada operasi.</td></tr>
        <tr th:each="data : ${riwayat}">
          <td th:text="${data.id}"></td><td th:text="${data.bilangan1}"></td><td th:text="${data.operator}"></td><td th:text="${data.bilangan2}"></td><td th:text="${data.hasil}"></td>
          <td class="actions"><a th:href="@{/(edit=${data.id})}">Edit</a>
            <form method="post" th:action="@{/hapus/{id}(id=${data.id})}" onsubmit="return confirm('Hapus operasi ini?')"><button type="submit">Hapus</button></form>
          </td>
        </tr>
      </tbody>
    </table></div>
  </section>
  <footer>Animasi UI oleh <a href="https://github.com/juliangarnier/anime">Anime.js</a> · Koleksi reaksi oleh <a href="https://github.com/ZekaiDev/anime-reaction-gif">ZekaiDev</a></footer>
</main>
</body>
</html>
