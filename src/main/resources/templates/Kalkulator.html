<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kalkulator CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="text-center mb-4">
        <h1 class="h2 fw-bold">Kalkulator CRUD</h1>
        <p class="text-muted">Form operasi aritmatika dan riwayat dalam satu halaman</p>
        <hr>
    </header>

    <section class="card shadow-sm border-0 mb-4">
        <h2 class="card-header bg-primary text-white h5" th:text="${id == null ? 'Form Operasi Aritmatika' : 'Edit Operasi #' + id}">Form Operasi Aritmatika</h2>
        <div class="card-body">
            <p class="alert alert-danger" role="alert" th:if="${pesan != null}" th:text="${pesan}"></p>
            <form method="post" th:action="@{/hitung}" class="row g-3 align-items-end">
                <input type="hidden" name="id" th:if="${id != null}" th:value="${id}">
                <div class="col-md">
                    <label for="bilangan1" class="form-label">Bilangan 1</label>
                    <input id="bilangan1" name="bilangan1" type="text" inputmode="decimal"
                           pattern="[+\-]?(?:[0-9]{1,12}(?:[.,][0-9]{0,12})?|[.,][0-9]{1,12})"
                           title="Masukkan angka, misalnya -3 atau 2,5" maxlength="26"
                           class="form-control" th:value="${bilangan1}" required>
                </div>
                <div class="col-md-2">
                    <label for="operator" class="form-label">Operator</label>
                    <select id="operator" name="operator" class="form-select">
                        <option th:each="op : ${operatorList}" th:value="${op}"
                                th:text="${op}" th:selected="${op == operator}"></option>
                    </select>
                </div>
                <div class="col-md">
                    <label for="bilangan2" class="form-label">Bilangan 2</label>
                    <input id="bilangan2" name="bilangan2" type="text" inputmode="decimal"
                           pattern="[+\-]?(?:[0-9]{1,12}(?:[.,][0-9]{0,12})?|[.,][0-9]{1,12})"
                           title="Masukkan angka, misalnya -3 atau 2,5" maxlength="26"
                           class="form-control" th:value="${bilangan2}" required>
                </div>
                <div class="col-auto">
                    <button class="btn btn-primary px-4" type="submit"
                            th:attr="aria-label=${id == null ? 'Hitung dan simpan' : 'Hitung dan simpan perubahan'}">=</button>
                </div>
                <div class="col-md">
                    <label for="hasil" class="form-label">Hasil</label>
                    <input id="hasil" class="form-control" th:value="${hasil}" readonly>
                </div>
                <div class="col-12" th:if="${id != null}">
                    <small class="text-muted">Tekan = untuk menyimpan perubahan.</small>
                    <a th:href="@{/}" class="ms-2">Batal</a>
                </div>
            </form>
        </div>
    </section>

    <section class="card shadow-sm border-0">
        <h2 class="card-header bg-dark text-white h5">Riwayat Operasi</h2>
        <div class="table-responsive">
            <table class="table table-striped align-middle mb-0">
                <thead><tr><th>ID</th><th>Bilangan 1</th><th>Operator</th><th>Bilangan 2</th><th>Hasil</th><th>Aksi</th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(riwayat)}"><td colspan="6" class="text-center text-muted py-3">Belum ada operasi.</td></tr>
                <tr th:each="data : ${riwayat}">
                    <td th:text="${data.id}"></td>
                    <td th:text="${data.bilangan1}"></td>
                    <td th:text="${data.operator}"></td>
                    <td th:text="${data.bilangan2}"></td>
                    <td th:text="${data.hasil}"></td>
                    <td class="text-nowrap">
                        <a class="btn btn-sm btn-warning" th:href="@{/(edit=${data.id})}">Edit</a>
                        <form class="d-inline" method="post" th:action="@{/hapus/{id}(id=${data.id})}"
                              onsubmit="return confirm('Hapus operasi ini?')">
                            <button type="submit" class="btn btn-sm btn-danger">Hapus</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
